name: Release Spoon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Spoon
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        # v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Verify date version and tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+|-alpha\.[0-9]+)?$ ]]; then
            echo "VERSION must be YYYY.MM.DD, YYYY.MM.DD.N, or YYYY.MM.DD-alpha.N; found: $version" >&2
            exit 1
          fi
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG must match VERSION $version (expected v$version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
          lua5.4 tests/run.lua

      - name: Build Spoon archive
        run: ./scripts/package-spoon.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=(--title "10bucks $VERSION" --generate-notes)
          if [[ "$VERSION" == *-alpha.* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/10bucks.spoon.zip "${flags[@]}"
